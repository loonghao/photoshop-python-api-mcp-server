name: Build and Release

permissions:
  # Only `contents` and `id-token` may appear here. This workflow is called
  # through `uses:` by the Release Please workflow, and a `workflow_call`
  # callee that requests any other permission makes GitHub reject the whole
  # caller workflow at compile time: the run ends as `startup_failure` with
  # zero jobs and an empty log. Keep this block limited to the two keys the
  # reusable-workflow contract accepts.
  contents: write  # For creating releases
  id-token: write  # For PyPI trusted publishing

on:
  push:
    tags:
      - 'v*'
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE*'
      - '.readthedocs.yml'
      - 'CITATION.cff'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - '**.rst'
      - '.gitignore'
      - '.gitmodules'
      - '.coveragerc'
      - 'codecov.yml'
      - 'renovate.json'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE*'
      - '.readthedocs.yml'
      - 'CITATION.cff'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - '**.rst'
      - '.gitignore'
      - '.gitmodules'
      - '.coveragerc'
      - 'codecov.yml'
      - 'renovate.json'
  # Called by the Release Please workflow once release-please has created the
  # tag. A tag pushed with GITHUB_TOKEN cannot trigger a workflow, so the
  # release workflow calls this one directly instead of relying on the tag.
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag being released, e.g. v0.1.12'
        required: true
        type: string
      publish_release:
        description: 'Attach build outputs to the release and publish them to PyPI'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish, e.g. v0.1.12. Leave empty to build and test only.'
        required: false
        default: ''
        type: string
      fast-mode:
        description: 'Skip building wheels and only run tests'
        required: false
        default: false
        type: boolean
      python-version:
        description: 'Python version to use for testing'
        required: false
        default: '3.10'
        type: string
      os:
        description: 'OS to run tests on (only Windows is supported)'
        required: false
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest

jobs:
  # Lint once, on a single Python version, in its own job.
  #
  # Lint used to be a step inside build-and-test, so a lint failure killed the
  # job before `Test` ever ran: the whole matrix reported red with zero test
  # evidence. Keeping it separate lets lint fail without hiding test results.
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Lint
        run: |
          uvx nox -s lint

  # Build and test the package
  build-and-test:
    name: Build and test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ['3.10', '3.11', '3.12', "3.13"]
        # No exclusions needed as we only support Windows
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            **/pyproject.toml
            **/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uvx poetry lock
          uvx poetry install
      - name: Test
        run: |
          uvx nox -s pytest
      - name: Build package
        run: |
          uvx poetry build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

  # Prepare Release
  prepare-release:
    name: Prepare Release
    needs: [lint, build-and-test]
    # github.event_name is the CALLER's event inside a reusable workflow, so
    # 'workflow_call' never matches here - when Release Please calls this file
    # the event is 'push' on refs/heads/main. The explicit publish_release input
    # is what actually signals "this is a real release".
    if: inputs.publish_release || inputs.tag_name != '' || github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # List all artifacts
      - name: List all artifacts
        run: Get-ChildItem -Path dist -Recurse -File | Sort-Object FullName
        shell: pwsh
      # Attach the build outputs to the release.
      #
      # The tag must be resolved explicitly: the default ref is 'main' when
      # Release Please calls this file or when it is dispatched by hand, and
      # that would publish against the wrong ref.
      #
      # gh release upload only adds assets. It does not rewrite the release
      # body, which matters because Release Please already wrote the real
      # changelog here and the softprops step this replaces overwrote it with
      # a generic template. It also avoids the update-a-release call softprops
      # makes for an existing release, which fails with 'Resource not
      # accessible by integration'.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber
        shell: bash
      # Upload artifacts for PyPI publishing
      - name: Upload artifacts for PyPI
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Publish to PyPI
  publish-to-pypi:
    name: Publish to PyPI
    needs: [prepare-release]
    if: inputs.publish_release || inputs.tag_name != '' || github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download artifacts for PyPI
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      # List all artifacts
      - name: List all artifacts
        run: find dist -type f | sort
      # Publish to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
